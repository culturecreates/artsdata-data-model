name: Generate MCP schema file

on:
  push:
    paths:
      - 'ontology/artsdata-ontology.ttl'
      - 'shacl/shacl_artsdata_common.ttl'
      - 'shacl/shacl_artsdata_event.ttl'
      - 'shacl/shacl_artsdata_liveperformancework.ttl'
      - 'shacl/shacl_artsdata_organization.ttl'
      - 'shacl/shacl_artsdata_place.ttl'
      - 'shacl/shacl_artsdata_person.ttl'
      - '_generators/generate_mcp_schema.rb'
      - '_generators/generate_schema_overview.rb'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: _generators

      - name: Regenerate artsdata-schema.ttl and schema-overview/index.html
        run: |
          cd _generators
          bundle exec ruby generate_mcp_schema.rb

      - name: Commit generated files if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Regenerate artsdata-schema.ttl and schema-overview/index.html'
          file_pattern: 'artsdata-schema.ttl schema-overview/index.html'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
